sonar.organization=vialabs-net
sonar.projectKey=vialabs-net_amqp-ftp-bridge
sonar.projectName=amqp-ftp-bridge

sonar.sourceEncoding=UTF-8
sonar.sources=.
sonar.exclusions=**/*_test.go,dist/**,.github/**

sonar.tests=.
sonar.test.inclusions=**/*_test.go

sonar.go.coverage.reportPaths=coverage.out
# Windows-only files are not built on the Linux runner that measures coverage.
# main.go only calls cli.Main.
sonar.coverage.exclusions=**/*_windows.go,internal/winsvc/windows.go,cmd/**

sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
