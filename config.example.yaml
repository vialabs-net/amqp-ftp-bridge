# amqp-ftp-bridge configuration example. Every value is fictional.
# Secrets never go in this file: fields named "credential" refer to a
# credential stored with `amqp-ftp-bridge creds set <name>`.

# Directory for credentials, temp files and logs.
# Default: %ProgramData%\amqp-ftp-bridge on Windows.
data_dir: 'C:\ProgramData\amqp-ftp-bridge'

# Audit and service logs. Default: <data_dir>\logs.
log_dir: 'C:\ProgramData\amqp-ftp-bridge\logs'

# Downloads are written here before the upload. Default: <data_dir>\tmp.
temp_dir: 'C:\ProgramData\amqp-ftp-bridge\tmp'

# Time allowed for the in-flight messages to finish on stop. Default: 5m.
shutdown_timeout: 5m

audit:
  # Audit and service log files older than this are deleted. Default: 365.
  retention_days: 365

amqp:
  # amqp:// or amqps://, with the virtual host as the path. No user or
  # password here.
  url: amqps://rabbitmq.example.internal:5671/files
  # Credential with the RabbitMQ user and password.
  credential: rabbitmq
  # AMQP heartbeat. Default: 10s.
  heartbeat: 10s
  # Longest wait between reconnection attempts. Default: 60s.
  reconnect_max: 60s

dead_letter:
  # Failed messages go to the exchange <queue><exchange_suffix> with routing
  # key <queue><routing_key_suffix>. Defaults: _deadLetter.
  exchange_suffix: _deadLetter
  routing_key_suffix: _deadLetter
  # Header with the error message. Default: x-error.
  error_header: x-error
  # Header with the failed step and the error chain. Default: x-error-stacktrace.
  stacktrace_header: x-error-stacktrace
  # Declare the dead-letter exchange (direct, durable), a durable queue named
  # after the routing key, and the binding. Default: true.
  declare: true

metrics:
  # Prometheus /metrics, /healthz and /readyz. Empty (default) = disabled.
  listen: "0.0.0.0:9464"

# HTTP sources. A file is downloaded with GET <url_prefix><source_id>.
sources:
  - name: files-api
    url_prefix: https://files.example.com/api/files/
    # Credential for HTTP Basic authentication. Optional.
    credential: files-api
    # Timeout for the whole download. Default: 5m.
    timeout: 5m

# FTP targets. Passive mode, binary type.
ftp:
  - name: main
    address: ftp.example.internal:21
    credential: ftp
    # Timeout for each FTP operation. Default: 1m.
    timeout: 1m

# One route per queue. The queue must already exist: it is not declared.
routes:
  - queue: files.upload
    source: files-api
    target: main
    # Where each value comes from:
    #   data._file.id      JSON path in the body (numbers index arrays: items.0.id)
    #   header:Name        AMQP header
    #   literal:text       fixed value
    mapping:
      source_id: data._file.id
      folder: header:DestinationPath
      file_name: data._file.name
    # Optional. Process the message only when field equals the value.
    match:
      field: event
      equals: upload
      # dead_letter (default): unmatched messages go to the dead-letter exchange.
      # upload_field: upload the JSON of upload_field as the file instead.
      otherwise: dead_letter

  - queue: files.legacy
    source: files-api
    target: main
    mapping:
      source_id: data.id
      folder: literal:legacy/incoming
      file_name: data.name
    match:
      field: event
      equals: upload
      otherwise: upload_field
      upload_field: data
    # Optional per-route override of the dead-letter exchange and routing key.
    dead_letter:
      exchange: files.legacy_deadLetter
      routing_key: files.legacy_deadLetter

# Optional HTTP routes: upload a request body to FTP, or download a file from
# FTP, in one HTTP request. Off unless listen is set. A service with HTTP
# routes only can omit amqp, dead_letter, sources and routes.
http:
  listen: "0.0.0.0:8080"
  # HTTP Basic users, stored with `creds set`. At least one.
  credentials: [http-client]
  # The client IP is read from X-Forwarded-For only when the peer is one of
  # these addresses or prefixes.
  trusted_proxies: [192.0.2.10]
  # FTP sessions open at once for all HTTP routes. Default: 8.
  max_ftp_sessions: 8
  # Wait for a free FTP session, then answer 503. Default: 30s.
  ftp_wait: 30s
  # Larger uploads get 413. Default: 200MiB.
  max_upload_bytes: 200MiB
  # Defaults: 10s, 10m, 10m, 2m.
  read_header_timeout: 10s
  read_timeout: 10m
  write_timeout: 10m
  idle_timeout: 2m
  routes:
    # POST /api/upload/ with headers X-Folder and X-File-Name.
    - name: upload
      action: upload
      method: POST
      path: /api/upload/
      ftp: main
      # header:Name, path:var, query:name or literal:text.
      folder: header:X-Folder
      file_name: header:X-File-Name

    # GET /api/file/L:/reports/2026/a.pdf downloads /reports/2026/a.pdf with
    # the login of credential ftp-disk-l.
    #   {name}     text inside one path segment
    #   {name...}  any text across "/", may be empty or start with "/"
    - name: download
      action: download
      method: GET
      path: "/api/file/{disk}:{dir...}/{name}"
      ftp: main
      folder: path:dir
      file_name: path:name
      # Optional: pick the FTP login from a value. An unknown value gets 404.
      ftp_credential_by: path:disk
      ftp_credentials: { L: ftp-disk-l }
